<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/styles.css">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <h2 class="logo">Virtual Store</h2>

        <a href="/">🏠 Home</a>

        <a href="/dashboard">📊 Dashboard</a>

        <a href="/products-page">📦 Products</a>

        <a href="/orders-page">🛒 Orders</a>

        <a href="/users-page">👥 Users</a>

        <a href="/invoice-page">🧾 Invoice</a>

    </div>

    <!-- Main -->

    <div class="content">

        <h1 class="mb-4">

            Dashboard

        </h1>

        <div class="row">

            <div class="col-md-4">

                <div class="dashboard-card">

                    <h2>Products</h2>

                    <h1>25</h1>

                </div>

            </div>

            <div class="col-md-4">

                <div class="dashboard-card">

                    <h2>Orders</h2>

                    <h1>18</h1>

                </div>

            </div>

            <div class="col-md-4">

                <div class="dashboard-card">

                    <h2>Users</h2>

                    <h1>8</h1>

                </div>

            </div>

        </div>

        <div class="mt-5">

            <h3>Recent Orders</h3>

            <table class="table table-striped">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Customer</th>

                        <th>Total</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>1</td>

                        <td>John</td>

                        <td>$350</td>

                        <td>Completed</td>

                    </tr>

                    <tr>

                        <td>2</td>

                        <td>Mary</td>

                        <td>$180</td>

                        <td>Pending</td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
